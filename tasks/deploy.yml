---
- name: "teleport | Deploy teleport configuration"
  ansible.builtin.template:
    src: "teleport.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'teleport_dest') +
      '/teleport.yaml' }}"
    owner: "root"
    group: "root"
    mode: "0640"
    validate: "teleport configure --test %s"
  notify:
    - "Restart teleport"
- name: "teleport | Enable teleport service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'teleport_service') }}"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'teleport', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'teleport') |
       community.general.json_query(lookup('ansible.builtin.vars',
      '_teleport_enable', default='')) == 'true'"
  vars:
    _teleport_enable: "[] | map(&enable || 'false', @) | [0]"
