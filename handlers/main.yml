---
- name: "teleport | Restart teleport"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'teleport_service') }}"
    state: "restarted"
  listen: "Restart teleport"
  when:
    - "lookup('ansible.builtin.vars', 'teleport', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'teleport') |
       community.general.json_query(lookup('ansible.builtin.vars',
      '_teleport_restart', default='')) == 'true'"
  vars:
    _teleport_restart: "[] | map(&restart || 'false', @) | [0]"
